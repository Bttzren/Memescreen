name: CI

# Runs the tests, then builds the Windows installer and attaches it to the run
# (Actions tab → pick a run → "Artifacts" → MemeDrop-Windows-Installer).
on:
  push:
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Client tests
        working-directory: client
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm test

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Electron + electron-builder downloads come from GitHub releases, which
      # sometimes time out (504). The NSIS tools that kept failing are bundled
      # in client/vendor/build-tools (npm run dist seeds them); the cache keeps
      # everything else between runs, saved even when a run fails.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: electron-win-
      - name: Install
        run: |
          npm ci --prefix server
          npm ci --prefix client
      - name: Client tests on Windows
        working-directory: client
        run: npm test
      - name: Build installer
        working-directory: client
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # Retry: each attempt keeps the downloads that worked, so retries make progress.
        run: |
          for ($i = 1; $i -le 4; $i++) {
            npm run dist
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Build attempt $i failed (usually a GitHub download timeout); retrying..."
            Start-Sleep -Seconds (20 * $i)
          }
          exit 1
      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-win-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: MemeDrop-Windows-Installer
          path: client/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      # Launch the packaged app on a real Windows desktop: a fake friend drops a
      # meme, and the test checks actual screen pixels (solid meme, see-through
      # elsewhere, 50% blend) and that a real Ctrl+Shift+X keypress clears it.
      - name: Smoke test the packaged app
        working-directory: client
        env:
          MEMEDROP_EXE: dist/win-unpacked/MemeDrop.exe
        run: npm run test:e2e
      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemeDrop-Smoke-Screenshots
          path: client/dist/smoke/*.png
          if-no-files-found: ignore
          retention-days: 14
